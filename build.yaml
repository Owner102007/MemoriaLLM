# Настройки кодогенерации drift.
#
# Файлы `*.g.dart` не хранятся в репозитории: у сессии разработки нет
# Flutter SDK, сгенерировать их локально нельзя, а держать в коммитах
# то, что не собирается на месте, — верный способ получить рассинхрон.
# Их собирает CI перед анализом и тестами.
targets:
  $default:
    builders:
      drift_dev:
        options:
          # Имена колонок — snake_case: nodeId в Dart, node_id в SQL.
          case_from_dart_to_sql: snake_case
          # Даты хранятся строкой ISO-8601 в UTC, а не числом. Так база
          # читаема глазами, а перевод часов и часовые пояса не сдвигают
          # уже записанное. Поменять это после релиза нельзя.
          store_date_time_values_as_text: true
