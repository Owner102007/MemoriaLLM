name: CI

on:
  push:
    # `ci-report` — служебная ветка с отчётом самого прогона (см. job
    # `report`). Без этого исключения запись отчёта запускала бы новый
    # прогон, который писал бы отчёт, и так до бесконечности.
    branches-ignore: [ci-report]
    # Сборка исследования СНО2026 (SNO-F-CFG-06, шаг 33): тег
    # `sno2026-N` собирает те же шесть сборок, а работа `study`
    # выкладывает четыре сборки ветвей отдельным релизом. Теги этапов
    # `v*` сюда не идут — их собирает release.yml.
    tags: ['sno2026-*']
  pull_request:
  workflow_dispatch:
    inputs:
      study_rehearsal:
        description: >-
          Репетиция сборки исследования СНО2026: собрать и сложить файлы
          релиза, но не публиковать
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v7

      # Версия Flutter записана одним значением в
      # `.github/actions/flutter` (S6.2.1). Прямой вызов
      # subosito/flutter-action остался только у канарейки — там он
      # нарочно без версии.
      - name: Поставить Flutter
        uses: ./.github/actions/flutter

      - name: Версия Flutter
        run: flutter --version

      # `--enforce-lockfile`: версии берутся из `pubspec.lock` и молча не
      # обновляются. Расхождение замка с `pubspec.yaml` — внятный отказ
      # прогона, а не другая сборка того же коммита (S6.2.1). Сам замок
      # создаёт работа «Замок зависимостей» в `bootstrap.yml`.
      #
      # Наличие замка проверяется **до** `pub get` и по индексу git, а не
      # по диску: `pub get` создаёт `pubspec.lock` сам, если его нет, —
      # значит, после этого шага файл есть всегда, и любая позднейшая
      # проверка «замок на месте» смотрела бы на файл этого же прогона.
      # Найдено прогоном №109, где тест «pubspec.lock лежит в
      # репозитории» прошёл при пустом репозитории.
      - name: Зависимости
        run: |
          set -eu
          if ! git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            text='pubspec.lock не в репозитории. Посчитать его может только'
            text="$text раннер (сессии закрыт pub.dev): Actions → Bootstrap"
            text="$text → работа «Замок зависимостей» посчитает замок и"
            text="$text закоммитит его сама."
            echo "::error title=Замок зависимостей::$text"
            exit 1
          fi
          flutter pub get --enforce-lockfile

      # Тесты слоя данных гоняют настоящий SQLite в памяти, а не заглушку.
      # На устройствах библиотеку приносит sqlite3_flutter_libs, раннеру
      # её ставим руками.
      #
      # `!cancelled()` у этого шага, у PDFium и у формата — не
      # аккуратность, а урок прогона №109: `Зависимости` упали, шаг без
      # `if` по умолчанию пропускается, и оба шага подготовки окружения
      # молча пропустились — а тесты с `!cancelled()` пошли и дали 89
      # упавших корпус-тестов вместо одной внятной причины. Подготовка
      # обязана выполняться всегда, иначе красный CI перестаёт означать
      # то, ради чего сделана S6.2.1.
      - name: Библиотека SQLite для тестов
        if: '!cancelled()'
        run: sudo apt-get install -y libsqlite3-dev

      # Корпус проблемных PDF гоняется настоящим PDFium. В сборках его
      # приносит pdfrx нативным ассетом, но в среде `flutter test` этот
      # путь ненадёжен, поэтому библиотека кладётся руками, а pdfrx
      # получает её через PDFIUM_PATH — единственный документированный
      # способ указать модуль явно.
      #
      # Версия и контрольная сумма живут в `tool/pdfium_version.txt` —
      # одном месте на весь проект, которое читают и этот шаг, и человек,
      # и тест согласия с `pdfium_dart/hook/build.dart` (S6.2.1). Архив
      # проверяется суммой, а не наличием файла: недокачанный или
      # подменённый раньше проходил `test -f` и валился внутри тестов,
      # где причина уже не видна.
      - name: Библиотека PDFium для корпус-тестов
        if: '!cancelled()'
        run: |
          set -eu
          spec='tool/pdfium_version.txt'
          release=$(sed -n 's/^release=//p' "$spec")
          asset=$(sed -n 's/^asset=//p' "$spec")
          sha256=$(sed -n 's/^sha256=//p' "$spec")
          test -n "$release" && test -n "$asset" && test -n "$sha256"
          base='https://github.com/bblanchon/pdfium-binaries/releases/download'
          curl -sSL --retry 3 -o /tmp/pdfium.tgz \
            "$base/${release/\//%2F}/$asset"
          echo "$sha256  /tmp/pdfium.tgz" | sha256sum -c -
          mkdir -p /tmp/pdfium
          tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium
          test -f /tmp/pdfium/lib/libpdfium.so
          echo 'PDFIUM_PATH=/tmp/pdfium/lib/libpdfium.so' >> "$GITHUB_ENV"

      # Логи прогона закрыты для неавторизованных, а у сессии разработки нет
      # доступа к GitHub API — поэтому вывод анализа и тестов дублируется
      # в сводку прогона, которая видна на странице run без входа в аккаунт.
      # Шаг не просто ругается, а показывает готовый патч: у сессии
      # разработки нет Dart SDK и прогнать `dart format` до пуша она не
      # может, поэтому единственный способ починить формат — увидеть
      # точный diff в логе прогона. Файлы при этом остаются
      # отформатированными, и анализ с тестами идут по нормальному коду:
      # одна ошибка формата не съедает целый прогон.
      - name: Форматирование
        id: fmt
        if: '!cancelled()'
        run: |
          set -o pipefail
          dart format . > /dev/null
          if ! git diff --quiet -- '*.dart'; then
            git --no-pager diff -- '*.dart' | tee /tmp/fmt.txt
            echo '::error title=Форматирование::dart format переписал файлы, патч выше'
            exit 1
          fi

      # После проверки формата: сгенерированные файлы в репозитории не
      # лежат, форматировать их незачем, а анализу и тестам они нужны.
      - name: Кодогенерация drift
        id: codegen
        if: '!cancelled()'
        run: |
          set -o pipefail
          dart run build_runner build 2>&1 \
            | tee /tmp/codegen.txt

      - name: Статический анализ
        id: analyze
        if: '!cancelled()'
        run: |
          set -o pipefail
          flutter analyze --fatal-infos --fatal-warnings 2>&1 | tee /tmp/analyze.txt

      - name: Тесты
        id: tests
        if: '!cancelled()'
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/tests.txt

      # Флаги ветви СНО2026 — константы сборки (`lib/sno/flags.dart`):
      # в одном прогоне тестов раздел «Тестирование» либо есть, либо
      # нет. Основной прогон выше проверил основное приложение; здесь
      # тесты `test/sno` собираются ещё дважды — ветвью I и ветвью II
      # (SNO-ALG-CFG-01). Упавшая ветвь не отменяет вторую.
      - name: Тесты ветвей СНО2026
        id: sno
        if: '!cancelled()'
        run: |
          set -o pipefail
          : > /tmp/sno.txt
          status=0
          for branch in I II; do
            echo "=== SNO_BRANCH=$branch ===" | tee -a /tmp/sno.txt
            flutter test test/sno --dart-define=SNO_BRANCH="$branch" \
              --reporter expanded 2>&1 | tee -a /tmp/sno.txt || status=1
          done
          exit "$status"

      # Принцип 4: номер сессии выдаётся один раз и имеет статус. Оба
      # уже случившихся сбоя — S4.1 и S5.4, выданные дважды, — эта
      # проверка поймала бы в день, когда их написали. План лежит вне
      # репозитория, поэтому в CI сверяется только реестр в
      # `PROGRESS.md`; локально, когда папка `docs/` на месте,
      # проверяются оба файла.
      - name: Номера сессий
        id: sessions
        if: '!cancelled()'
        run: |
          set -o pipefail
          dart run tool/check_session_numbers.dart 2>&1 | tee /tmp/sessions.txt

      # Сводка видна только авторизованным, а аннотации — всем, поэтому при
      # падении вывод дублируется ещё и аннотацией.
      - name: Ошибки в аннотации
        if: failure()
        run: |
          # У падения тестов хвост вывода бесполезен: последними идут те
          # тесты, что прошли, а упавшие уехали вверх на сотни строк.
          # Поэтому они вынимаются отдельно — по метке `[E]`, которой их
          # помечает расширенный отчёт. Без этого сессия разработки видит
          # «-2» и не видит, что именно упало: логи прогона закрыты для
          # неавторизованных, а аннотации — единственное, что видно всем.
          if [ -s /tmp/tests.txt ] || [ -s /tmp/sno.txt ]; then
            { cat /tmp/tests.txt /tmp/sno.txt 2>/dev/null \
                | grep -B 100 -A 30 '\[E\]' || true; } \
              | head -n 200 > /tmp/failures.txt
          fi
          for pair in 'Форматирование:/tmp/fmt.txt' \
                      'Кодогенерация:/tmp/codegen.txt' \
                      'Анализ:/tmp/analyze.txt' \
                      'Упавшие тесты:/tmp/failures.txt' \
                      'Тесты:/tmp/tests.txt' \
                      'Тесты ветвей:/tmp/sno.txt' \
                      'Номера сессий:/tmp/sessions.txt'; do
            title="${pair%%:*}"
            file="${pair#*:}"
            [ -s "$file" ] || continue
            # Патч форматирования надо видеть целиком: применить его
            # сессии больше нечем — Dart SDK у неё нет. Хвост в сорок
            # строк показывал последний файл и прятал остальные.
            case "$title" in
              'Упавшие тесты') text=$(cat "$file") ;;
              'Форматирование') text=$(head -n 400 "$file") ;;
              *) text=$(tail -n 40 "$file") ;;
            esac
            body=$(printf '%s\n' "$text" \
              | sed -e 's/%/%25/g' -e 's/\r/ /g' \
              | awk '{printf "%s%%0A", $0}')
            echo "::error title=$title::$body"
          done

      # Логи прогона GitHub отдаёт только авторизованным, а у сессии
      # разработки нет ни входа в аккаунт, ни доступа к API. Поэтому
      # вывод складывается в артефакт, а job `report` кладёт его в ветку
      # `ci-report`: git из сессии работает всегда и ничего не кэширует.
      - name: Собрать вывод для отчёта
        if: always()
        run: |
          mkdir -p /tmp/report
          for pair in 'format:/tmp/fmt.txt' \
                      'codegen:/tmp/codegen.txt' \
                      'analyze:/tmp/analyze.txt' \
                      'tests:/tmp/tests.txt' \
                      'sno:/tmp/sno.txt' \
                      'sessions:/tmp/sessions.txt'; do
            file="${pair#*:}"
            [ -s "$file" ] && cp "$file" "/tmp/report/${pair%%:*}.txt"
          done
          # Окно большое намеренно: у widget-теста разбор падения
          # («EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK» со стеком)
          # печатается **до** строки с меткой [E], и на двух строках
          # контекста от него не остаётся ничего.
          if [ -s /tmp/tests.txt ] || [ -s /tmp/sno.txt ]; then
            { cat /tmp/tests.txt /tmp/sno.txt 2>/dev/null \
                | grep -B 100 -A 30 '\[E\]' || true; } \
              > /tmp/report/failures.txt
            # Замеры скорости (F-READ-02) корпус-тесты печатают строками
            # «ЗАМЕР». Идут они в середине прогона и в хвост вывода не
            # попадают, а числа нужны в PROGRESS.md — поэтому вынимаются
            # отдельным файлом и уезжают в отчёт своим разделом.
            { grep -a 'ЗАМЕР' /tmp/tests.txt 2>/dev/null || true; } \
              > /tmp/report/measures.txt
          fi
          echo "${{ job.status }}" > /tmp/report/status.txt
          ls -l /tmp/report

      - name: Выложить вывод
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: /tmp/report
          if-no-files-found: ignore

      - name: Сводка прогона
        if: always()
        run: |
          {
            echo '## Результаты'
            for pair in 'Форматирование:/tmp/fmt.txt' \
                        'Кодогенерация:/tmp/codegen.txt' \
                        'Анализ:/tmp/analyze.txt' \
                        'Тесты:/tmp/tests.txt' \
                        'Тесты ветвей:/tmp/sno.txt' \
                        'Номера сессий:/tmp/sessions.txt'; do
              title="${pair%%:*}"
              file="${pair#*:}"
              echo "### $title"
              if [ -s "$file" ]; then
                echo '```'
                tail -c 40000 "$file"
                echo '```'
              else
                echo '_шаг не выполнялся или ничего не вывел_'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Три приложения из одного кода (SNO-F-CFG-01, SNO-ALG-CFG-01):
  # основное и две ветви для тестировщиков исследования СНО2026. У
  # каждого свой флейвор Android (идентификатор, имя, иконка,
  # разрешения) и своё значение `SNO_BRANCH` (поведение приложения) —
  # задаются они вместе, здесь.
  #
  # Литературы в сборках ветвей нет: она приходит архивом (шаг 13).
  # Пароль теста нагрузки сборки ветвей получают из секрета
  # `SNO_CLT_PASSWORD` (шаг 24, SNO-F-CLT-01): без него теста в сборке
  # нет вовсе. Основная сборка пароля не получает никогда.
  android:
    name: Сборка APK · ${{ matrix.title }}
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      # Упавшая сборка ветви не отменяет остальные: по одному прогону
      # должно быть видно, что сломано, а что нет.
      fail-fast: false
      matrix:
        include:
          - title: основное
            flavor: full
            branch: ''
            suffix: main
            package: io.github.owner102007.memoria
            label: Memoria LLM HB
            artifact: memoria-android-apk
            file: memoria.apk
          - title: ветвь I
            flavor: sno2026core
            branch: I
            suffix: sno2026.I
            package: io.github.owner102007.memoria.sno2026.core
            label: Memoria · СНО2026 · I
            artifact: memoria-sno2026-I-android-apk
            file: memoria-sno2026-I.apk
          - title: ветвь II
            flavor: sno2026test
            branch: II
            suffix: sno2026.II
            package: io.github.owner102007.memoria.sno2026.test
            label: Memoria · СНО2026 · II
            artifact: memoria-sno2026-II-android-apk
            file: memoria-sno2026-II.apk
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v7

      - name: Есть ли папка android/
        id: probe
        run: |
          if [ -d android ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::android/ ещё не сгенерирована — сборка пропущена'
          fi

      - name: Поставить JDK 17
        if: steps.probe.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Flutter
        if: steps.probe.outputs.ready == 'true'
        uses: ./.github/actions/flutter

      - name: Зависимости
        if: steps.probe.outputs.ready == 'true'
        run: flutter pub get --enforce-lockfile

      - name: Кодогенерация drift
        if: steps.probe.outputs.ready == 'true'
        run: dart run build_runner build

      # Сборки ветвей подписываются постоянным ключом (SNO-F-REC-13):
      # новая сборка встаёт поверх прежней, и записи сессий на телефоне
      # остаются на месте. Ключ лежит у владельца и приходит сюда
      # четырьмя секретами репозитория; в файл он раскладывается вне
      # рабочей папки и только для сборки ветви. Секретов нет (чужой
      # форк, запрос на слияние со стороны) — сборка подписывается
      # отладочным ключом прогона, как раньше, и шаг «Чем подписан APK»
      # говорит об этом предупреждением.
      - name: Собрать APK
        if: steps.probe.outputs.ready == 'true'
        env:
          FLAVOR: ${{ matrix.flavor }}
          SNO_BRANCH: ${{ matrix.branch }}
          SUFFIX: ${{ matrix.suffix }}
          FILE: ${{ matrix.file }}
          SNO_KEYSTORE_BASE64: ${{ secrets.SNO_KEYSTORE_BASE64 }}
          SNO_KEYSTORE_PASSWORD: ${{ secrets.SNO_KEYSTORE_PASSWORD }}
          SNO_KEY_ALIAS: ${{ secrets.SNO_KEY_ALIAS }}
          SNO_KEY_PASSWORD: ${{ secrets.SNO_KEY_PASSWORD }}
          SNO_CLT_PASSWORD: ${{ secrets.SNO_CLT_PASSWORD }}
        run: |
          set -eu
          if [ -n "${SNO_BRANCH:-}" ] && [ -n "${SNO_KEYSTORE_BASE64:-}" ]; then
            # Секрет могли вставить с переводами строк — их в ключе нет.
            printf '%s' "$SNO_KEYSTORE_BASE64" | tr -d '\r\n ' \
              | base64 -d > "$RUNNER_TEMP/sno.jks"
            export SNO_KEYSTORE_FILE="$RUNNER_TEMP/sno.jks"
            # Отпечаток самого ключа — пока ключ ещё лежит на диске. С
            # ним шаг «Чем подписан APK» сверит подпись собранного: так
            # видно, что сборка подписана ключом из секретов, а не
            # отладочным, которым она подписалась бы молча.
            keytool -list -v -keystore "$RUNNER_TEMP/sno.jks" \
              -storepass:env SNO_KEYSTORE_PASSWORD \
              -alias "$SNO_KEY_ALIAS" 2>/dev/null \
              | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 \
              | tr 'A-F' 'a-f' | tr -d ': \r' > "$RUNNER_TEMP/sno.sha256" || true
          fi
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          # Пароль теста нагрузки — только сборке ветви и только из
          # секрета (SNO-F-CLT-01, SNO-DIV-06): в исходниках его нет.
          # Секрета нет (чужой форк, запрос на слияние со стороны) —
          # сборка ветви выходит без теста, и об этом сказано.
          clt=()
          if [ -n "${SNO_BRANCH:-}" ] && [ -n "${SNO_CLT_PASSWORD:-}" ]; then
            # Секрет могли вставить с пробелом или переводом строки.
            password=$(printf '%s' "$SNO_CLT_PASSWORD" | tr -d '\r\n ')
            # Пароль набирают цифрами на экране: пароль с буквой или
            # длиннее двенадцати знаков запер бы тест навсегда — и молча.
            if ! printf '%s' "$password" | grep -Eq '^[0-9]{1,12}$'; then
              echo "::error title=Тест нагрузки::секрет SNO_CLT_PASSWORD — не от одной до двенадцати цифр: такой пароль на экране не набрать"
              exit 1
            fi
            clt=(--dart-define=SNO_CLT_PASSWORD="$password")
          elif [ -n "${SNO_BRANCH:-}" ]; then
            echo "::warning title=Тест нагрузки::секрета SNO_CLT_PASSWORD нет — сборка ветви $SNO_BRANCH выходит без теста нагрузки"
          fi
          # SNO-F-CFG-06: сборка исследования — только по тегу sno2026-N
          # и только у ветви. Тег и день сборки зашиваются в приложение:
          # «О ветви» называет их, а запись кладёт в манифест. Сборка
          # исследования без пароля теста и без постоянного ключа подписи
          # не выходит вовсе: на ней записывают участников.
          study=()
          if [ -n "${SNO_BRANCH:-}" ] && [ "${GITHUB_EVENT_NAME:-}" = push ] \
            && [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            if ! printf '%s' "$GITHUB_REF_NAME" \
              | grep -Eq '^sno2026-[1-9][0-9]*([.][1-9][0-9]*)?$'; then
              echo "::error title=Сборка исследования::тег $GITHUB_REF_NAME — не sno2026-N и не sno2026-N.M"
              exit 1
            fi
            if [ -z "${SNO_CLT_PASSWORD:-}" ]; then
              echo "::error title=Сборка исследования::секрета SNO_CLT_PASSWORD нет — сборка исследования без теста нагрузки не выходит"
              exit 1
            fi
            if [ -z "${SNO_KEYSTORE_BASE64:-}" ]; then
              echo "::error title=Сборка исследования::секретов ключа подписи нет — сборка исследования не встанет поверх прежней"
              exit 1
            fi
            study=(--dart-define=APP_STUDY_TAG="$GITHUB_REF_NAME")
          fi
          built=$(date -u +%F)
          flutter build apk --release \
            --flavor "$FLAVOR" \
            --dart-define=SNO_BRANCH="${SNO_BRANCH:-}" \
            --dart-define=APP_VERSION="$version-$SUFFIX" \
            --dart-define=APP_COMMIT="$GITHUB_SHA" \
            --dart-define=APP_BUILT="$built" \
            ${clt[@]+"${clt[@]}"} \
            ${study[@]+"${study[@]}"}
          rm -f "$RUNNER_TEMP/sno.jks"
          mkdir -p out
          cp "build/app/outputs/flutter-apk/app-$FLAVOR-release.apk" "out/$FILE"

      # Проверяется собранное, а не исходники: у приложения ветви свой
      # идентификатор и своё имя (SNO-F-CFG-01). Доступ ко всем файлам
      # есть у всех трёх приложений: основное ищет книги, ветвь — архив
      # с литературой (SNO-F-LIT-03); записи в чужие файлы и доступа к
      # фото, видео и звуку нет ни у кого. Поставщик файлов для архивов
      # записей (SNO-F-REC-06) есть у ветвей и только у них; так же —
      # служба переднего плана записи и её разрешения (SNO-F-REC-13).
      # Строки в двоичном манифесте лежат в UTF-8 или в UTF-16 — ищутся
      # обе записи.
      - name: Что внутри APK
        if: steps.probe.outputs.ready == 'true'
        env:
          FILE: ${{ matrix.file }}
          SNO_BRANCH: ${{ matrix.branch }}
          PACKAGE: ${{ matrix.package }}
          LABEL: ${{ matrix.label }}
        run: |
          python3 - "out/$FILE" <<'PY'
          import os
          import sys
          import zipfile

          manifest = zipfile.ZipFile(sys.argv[1]).read('AndroidManifest.xml')
          # Пустая переменная до процесса может не дойти вовсе.
          branch = os.environ.get('SNO_BRANCH', '')
          package = os.environ['PACKAGE']
          label = os.environ['LABEL']


          def has(text):
              return (text.encode('utf-8') in manifest
                      or text.encode('utf-16-le') in manifest)


          def exact(text):
              # Строка целиком, а не начало более длинной: в пуле строк
              # двоичного манифеста за строкой стоит нулевой знак.
              return has(text + '\0')


          problems = []
          if not exact(package):
              problems.append(f'идентификатор не {package}')
          if not exact(label):
              problems.append(f'имя приложения не «{label}»')
          # Всё, чем приложение могло бы добраться до чужих файлов:
          # разрешения на хранилище и на медиа, старый режим доступа.
          storage = [name for name in ('MANAGE_EXTERNAL_STORAGE',
                                       'READ_EXTERNAL_STORAGE',
                                       'WRITE_EXTERNAL_STORAGE',
                                       'READ_MEDIA_',
                                       'requestLegacyExternalStorage')
                     if has(name)]
          # Читать файлы устройства — да: основное приложение ищет
          # книги, ветвь — архив с литературой (SNO-F-LIT-03). Писать в
          # чужие файлы и смотреть фото, видео и звук — нет, никому.
          extra = [name for name in storage
                   if name in ('WRITE_EXTERNAL_STORAGE', 'READ_MEDIA_')]
          if extra:
              problems.append('в сборке есть лишний доступ к файлам: '
                              + ', '.join(extra))
          if 'MANAGE_EXTERNAL_STORAGE' not in storage:
              problems.append('в сборке нет MANAGE_EXTERNAL_STORAGE')
          if not branch and has('sno2026'):
              problems.append('в основной сборке есть след ветви sno2026')
          # SNO-F-REC-06: архив записи уходит с телефона через
          # поставщика файлов сборки ветви. В основном приложении его
          # нет: записей там не бывает, и отдавать наружу нечего.
          provider = has('RecordsFileProvider')
          # Имя класса — полное и от пакета кода, а не от
          # идентификатора сборки: у ветви идентификатор с хвостом, и
          # класса с таким именем не существует.
          if branch and not exact('io.github.owner102007.memoria'
                                  '.RecordsFileProvider'):
              problems.append('в сборке ветви нет поставщика файлов '
                              'для архивов записей (или его имя '
                              'сложено от идентификатора сборки)')
          if branch and not exact(package + '.records'):
              problems.append('у поставщика файлов не то имя: ждали '
                              f'{package}.records')
          if not branch and provider:
              problems.append('в основной сборке есть поставщик файлов '
                              'для архивов записей')
          # SNO-F-REC-13: пока идёт запись сессии, сборка ветви держит
          # службу переднего плана с уведомлением — свёрнутое
          # приложение не выгружается. В основном приложении записи
          # нет, и службы тоже.
          service = 'io.github.owner102007.memoria.RecordingService'
          if branch:
              if not exact(service):
                  problems.append('в сборке ветви нет службы записи')
              for name in ('FOREGROUND_SERVICE',
                           'FOREGROUND_SERVICE_SPECIAL_USE',
                           'POST_NOTIFICATIONS'):
                  if not exact('android.permission.' + name):
                      problems.append('в сборке ветви нет разрешения '
                                      + name)
          else:
              if has('RecordingService'):
                  problems.append('в основной сборке есть служба записи')
              for name in ('FOREGROUND_SERVICE', 'POST_NOTIFICATIONS',
                           'PROPERTY_SPECIAL_USE_FGS_SUBTYPE'):
                  if has(name):
                      problems.append('в основной сборке есть след '
                                      'службы записи: ' + name)
          for problem in problems:
              print(f'::error title=Что внутри APK::{problem}')
          print(f'{sys.argv[1]}: {package}, «{label}», '
                f'разрешения на файлы: {storage or "нет"}')
          sys.exit(1 if problems else 0)
          PY

      # SNO-F-REC-13: сборка ветви обязана быть подписана одним и тем
      # же ключом от прогона к прогону — иначе она не встанет поверх
      # прежней и унесёт записи с телефонов. Отпечаток ключа (не
      # секрет) записан в `tool/sno_signing_sha256.txt`; пока его там
      # нет, прогон печатает отпечаток, чтобы его туда вписали.
      - name: Чем подписан APK
        if: steps.probe.outputs.ready == 'true'
        env:
          FILE: ${{ matrix.file }}
          SNO_BRANCH: ${{ matrix.branch }}
          HAS_KEY: ${{ secrets.SNO_KEYSTORE_BASE64 != '' }}
        run: |
          set -eu
          title='title=Чем подписан APK'
          # Отпечаток читается из блока подписи самого APK своим
          # разбором: вывод `apksigner` меняется от версии к версии
          # инструментов сборки (до 36-й — «Signer #1 certificate…»,
          # с 37-й — «V2 Signer: certificate…»), и на этом шаг уже
          # падал (прогон №255, вторая попытка). Блоков подписи может
          # быть несколько — сертификат в них обязан быть один.
          digest=$(python3 tool/apk_cert_sha256.py "out/$FILE" | sort -u || true)
          count=$(printf '%s\n' "$digest" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error $title::в блоках подписи out/$FILE разные сертификаты: $(printf '%s' "$digest" | tr '\n' ' ')"
            exit 1
          fi
          # `apksigner` — вторым мнением: согласен — хорошо, расходится
          # — отказ, молчит — замечание с его словами, чтобы причину
          # было видно в сводке прогона.
          signer=$(ls -d "${ANDROID_HOME:-/nonexistent}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$signer" ]; then
            status=0
            said=$("$signer" verify --print-certs "out/$FILE" 2>&1) || status=$?
            second=$(printf '%s\n' "$said" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | tr 'A-F' 'a-f' | tr -d ': \r' | sort -u || true)
            if [ -z "$second" ]; then
              echo "::notice $title::apksigner ($signer) отпечатка не отдал, код $status: $(printf '%s' "$said" | head -c 400 | tr '\r\n' '  ')"
            elif [ "$second" != "$digest" ]; then
              echo "::error $title::apksigner и разбор блока подписи расходятся: $(printf '%s' "$second" | tr '\n' ' ') и ${digest:-ничего}"
              exit 1
            fi
          else
            echo "::notice $title::apksigner на раннере не найден (ANDROID_HOME=${ANDROID_HOME:-не задан})"
          fi
          wanted=$(grep -v '^#' tool/sno_signing_sha256.txt \
            | tr 'A-F' 'a-f' | tr -d ': \r' | grep -m1 . || true)
          echo "out/$FILE: отпечаток подписи ${digest:-не прочитан}"
          if [ -z "${SNO_BRANCH:-}" ]; then
            exit 0
          fi
          # Ключ в секретах есть — сборка ветви обязана быть подписана
          # именно им. Отпечаток ключа посчитан шагом сборки по самому
          # файлу ключа, и расхождение значит, что сборка взяла другую
          # подпись (отладочную), хотя ключ ей дали.
          key=''
          if [ -s "$RUNNER_TEMP/sno.sha256" ]; then
            key=$(tr -d ' \r\n' < "$RUNNER_TEMP/sno.sha256")
          fi
          if [ "$HAS_KEY" = 'true' ] && [ -z "$key" ]; then
            echo "::error $title::ключ в секретах есть, а его отпечаток шаг сборки не посчитал — сверить подпись сборки ветви не с чем"
            exit 1
          fi
          if [ -n "$key" ] && [ "$digest" != "$key" ]; then
            echo "::error $title::сборка ветви подписана не ключом из секретов: ${digest:-подпись не прочитана} вместо $key"
            exit 1
          fi
          # Чужой репозиторий и запрос из форка секретов не видят: их
          # сборка ветви подписана случайным ключом, и это не ошибка —
          # её никто не ставит поверх нашей.
          outside=false
          if [ "$HAS_KEY" != 'true' ]; then
            if [ "$GITHUB_EVENT_NAME" = 'pull_request' ] \
              || [ "$GITHUB_REPOSITORY" != 'Owner102007/MemoriaLLM' ]; then
              outside=true
            fi
          fi
          if [ -n "$wanted" ]; then
            # Отпечаток записан — сборка ветви обязана быть подписана
            # этим ключом, чем бы она ни была собрана: иначе в `latest`
            # уйдёт сборка, которая не встанет поверх прежней.
            if [ "$digest" = "$wanted" ]; then
              echo 'подпись сходится с tool/sno_signing_sha256.txt'
              exit 0
            fi
            said="сборка ветви подписана не тем ключом: ${digest:-подпись не прочитана} вместо $wanted"
            if [ "$outside" = 'true' ]; then
              echo "::warning $title::$said (секретов ключа у этого прогона нет)"
              exit 0
            fi
            echo "::error $title::$said"
            exit 1
          fi
          if [ "$HAS_KEY" != 'true' ]; then
            echo "::warning $title::секретов ключа в репозитории нет — сборка ветви подписана случайным ключом прогона и поверх прежней сборки не встанет (записи на телефоне сотрутся вместе с ней)"
            exit 0
          fi
          if [ -z "$digest" ]; then
            echo "::error $title::ключ в секретах есть, а подпись сборки ветви прочитать не удалось"
            exit 1
          fi
          echo "::notice $title::отпечаток ключа сборок ветвей: $digest — впишите его в tool/sno_signing_sha256.txt"

      - name: Выложить APK
        if: steps.probe.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.file }}
          if-no-files-found: error

  # Спутник взгляда (SNO-F-EYE-04, шаг 26): программа на Python рядом
  # с приложением ветви для Windows. Тесты — на Linux, по тому же замку
  # колёс, что уезжает в сборку; модель лица — по своему замку.
  eye-tests:
    name: Спутник взгляда · тесты
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v7

      - name: Поставить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Строго по замку: версии и суммы колёс — eye/requirements.lock
      # (собирает eye/tool/make_lock.py), тестовые — requirements-dev.lock.
      - name: Колёса по замку
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary :all: --no-deps \
            -r eye/requirements.lock -r eye/requirements-dev.lock

      # MediaPipe грузит libEGL и libGLESv2 даже для работы на процессоре;
      # на раннере их нет.
      - name: Библиотеки EGL для MediaPipe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2

      - name: Модель лица по замку
        run: python eye/tool/fetch_model.py

      - name: pytest
        if: always()
        env:
          SNO_EYE_REQUIRE_MODEL: '1'
          MPLBACKEND: Agg
        run: |
          mkdir -p /tmp/eye-logs
          cd eye
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee /tmp/eye-logs/eye-tests.txt

      - name: Выложить вывод
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eye-logs-linux
          path: /tmp/eye-logs
          if-no-files-found: ignore

  # Папка eye/ для ZIP ветвей: встраиваемый Python с подписью PSF,
  # колёса по замку, модель по замку; пробный запуск на раннере и
  # сетевые соединения спутника за пробу — в отчёт (решение Т9).
  eye-windows:
    name: Спутник взгляда · сборка Windows
    runs-on: windows-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v7

      - name: Поставить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Собрать папку eye/
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          New-Item -ItemType Directory -Force -Path eye-logs | Out-Null
          python eye/tool/build_windows.py build/eye 2>&1 | Tee-Object -FilePath eye-logs/eye-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Камеры на раннере нет: пробный запуск обязан сказать это словами.
      # Пока он идёт, снимаются соединения процесса — что отправляет
      # MediaPipe, видно здесь, а не на ПК участника.
      - name: Пробный запуск и сетевые соединения
        shell: pwsh
        run: |
          $dnsBefore = @{}
          Get-DnsClientCache -ErrorAction SilentlyContinue | ForEach-Object { $dnsBefore[$_.Entry] = 1 }
          $p = Start-Process -FilePath build/eye/python.exe `
            -ArgumentList '-I','-m','sno_eye','--selftest','--linger','12' `
            -WorkingDirectory build/eye -NoNewWindow -PassThru `
            -RedirectStandardOutput selftest-out.txt -RedirectStandardError selftest-err.txt
          $null = $p.Handle
          $seen = [ordered]@{}
          while (-not $p.HasExited) {
            Get-NetTCPConnection -OwningProcess $p.Id -ErrorAction SilentlyContinue |
              ForEach-Object { $seen["tcp $($_.RemoteAddress):$($_.RemotePort)"] = 1 }
            Get-NetUDPEndpoint -OwningProcess $p.Id -ErrorAction SilentlyContinue |
              ForEach-Object { $seen["udp local $($_.LocalAddress):$($_.LocalPort)"] = 1 }
            Start-Sleep -Milliseconds 200
          }
          $p.WaitForExit()
          $code = $p.ExitCode
          $dnsNew = Get-DnsClientCache -ErrorAction SilentlyContinue |
            Where-Object { -not $dnsBefore.ContainsKey($_.Entry) } |
            ForEach-Object { "dns $($_.Entry)" } | Sort-Object -Unique
          $lines = @('# Пробный запуск', '', '```') + (Get-Content selftest-out.txt) + @('```', '', '## stderr', '```') +
            (Get-Content selftest-err.txt | Select-Object -Last 40) + @('```', '', '## Сеть за пробу') +
            @($seen.Keys) + @($dnsNew)
          if ($seen.Count -eq 0 -and -not $dnsNew) { $lines += 'соединений не было' }
          $lines += @('', '## Размер'); $lines += (Get-Content build/eye-build.json)
          $lines | Out-File -Encoding utf8 eye-logs/eye-selftest.txt
          Get-Content eye-logs/eye-selftest.txt
          if ($code -ne 0) {
            Write-Output "::error title=Спутник взгляда::пробный запуск вернул $code"
            exit 1
          }

      # BUG-56: та же папка, распакованная в путь с кириллицей. Кодовая
      # страница системы на раннере — 1252, и такой путь в ней не
      # выражается вовсе: модель, открытая по пути, здесь не открылась бы.
      - name: Пробный запуск из папки с кириллицей
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Рабочий стол\Тест айтрекера'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -Recurse -Path build/eye -Destination (Join-Path $dir 'eye')
          $eye = Join-Path $dir 'eye'
          Push-Location $eye
          & (Join-Path $eye 'python.exe') -I -m sno_eye --selftest 2>&1 |
            Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'eye-logs/eye-selftest-cyrillic.txt')
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) {
            Write-Output "::error title=BUG-56::пробный запуск из папки с кириллицей вернул $code"
            exit 1
          }

      # Шаг 36, SNO-F-RES-06: «Сравнение ветвей» встраиваемым Python
      # собранной папки — numpy и matplotlib из замка спутника, рисунки
      # без окна (Agg), кириллица в пути и к архивам, и к отчёту. Набор
      # архивов собирает генератор тестов Python'ом раннера (он без
      # numpy — генератору хватает стандартной библиотеки). Шаг 37: в
      # наборе есть поток взгляда и кадры раскладки — меры
      # беспорядочности, средний взгляд и научение (Р6–Р12), ссылки на
      # файлы отчёта (BUG-68).
      - name: Сравнение ветвей встраиваемым Python
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Результаты СНО\Набор (II + I)'
          python eye/tests/study_scenario.py $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP 'Сравнение ветвей СНО2026\прогон'
          $eye = (Resolve-Path build/eye).Path
          Push-Location $eye
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & (Join-Path $eye 'python.exe') -I -m sno_eye study $root --out $out 2>&1 |
            Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'eye-logs/eye-study.txt')
          $code = $LASTEXITCODE
          $sw.Stop()
          Pop-Location
          "ЗАМЕР Сравнение ветвей: 16 архивов за $([math]::Round($sw.Elapsed.TotalSeconds, 1)) с" |
            Tee-Object -Append -FilePath eye-logs/eye-study.txt
          if ($code -ne 0) {
            Write-Output "::error title=SNO-F-RES-06::«Сравнение ветвей» вернуло $code"
            exit 1
          }
          $need = @('index.html', 'участники.csv', 'походы.csv', 'ответы_теста.csv',
                    'сравнение.csv', 'устойчивость.csv', 'исходные.json',
                    'рисунки/Р1_состав.png', 'рисунки/Р4_нагрузка.svg',
                    'рисунки/Р6_беспорядочность.png', 'рисунки/Р7_переходы.png',
                    'рисунки/Р8_доли_времени.png', 'рисунки/Р9_по_минутам.png',
                    'рисунки/Р10_тепловая_карта.png',
                    'рисунки/Р11_схема_полки.png', 'рисунки/Р12_научение.png',
                    'рисунки/Р13_сводка.png', 'рисунки/Р14_устойчивость.png')
          foreach ($f in $need) {
            if (-not (Test-Path -LiteralPath (Join-Path $out $f))) {
              Write-Output "::error title=SNO-F-RES-06::в отчёте нет $f"
              exit 1
            }
          }
          $page = Get-Content -LiteralPath (Join-Path $out 'index.html') -Raw -Encoding utf8
          if ($page -notmatch 'в ветви II меньше') {
            Write-Output '::error title=SNO-F-RES-06::заложенная разница ветвей не найдена'
            exit 1
          }
          # BUG-68: отчёт ведёт к своим таблицам.
          if ($page -notmatch "href='%D1%83%D1%87%D0%B0%D1%81%D1%82%D0%BD%D0%B8%D0%BA%D0%B8.csv'") {
            Write-Output '::error title=BUG-68::в отчёте нет ссылки на участники.csv'
            exit 1
          }

      - name: Выложить папку eye/
        uses: actions/upload-artifact@v7
        with:
          name: eye-windows
          path: build/eye
          if-no-files-found: error

      - name: Выложить вывод
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eye-logs-windows
          path: eye-logs
          if-no-files-found: ignore

  # Те же три приложения для Windows. Флейворов там нет: ветвь называют
  # переменная окружения `SNO_BRANCH` (заголовок окна, см.
  # `windows/runner`) и то же значение в `--dart-define` (поведение и
  # своя папка данных). MSIX — только у основного: ветви в Store не идут.
  windows:
    name: Сборка Windows · ${{ matrix.title }}
    needs: [analyze, eye-windows]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: основное
            branch: ''
            suffix: main
            label: Memoria LLM HB
            artifact: memoria-windows
            zip: memoria-windows-portable.zip
            msix: true
          - title: ветвь I
            branch: I
            suffix: sno2026.I
            label: Memoria · СНО2026 · I
            artifact: memoria-sno2026-I-windows
            zip: memoria-sno2026-I-windows.zip
            msix: false
          - title: ветвь II
            branch: II
            suffix: sno2026.II
            label: Memoria · СНО2026 · II
            artifact: memoria-sno2026-II-windows
            zip: memoria-sno2026-II-windows.zip
            msix: false
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v7

      - name: Есть ли папка windows/
        id: probe
        shell: pwsh
        run: |
          if (Test-Path 'windows') {
            'ready=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            'ready=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Output '::notice::windows/ ещё не сгенерирована — сборка пропущена'
          }

      - name: Поставить Flutter
        if: steps.probe.outputs.ready == 'true'
        uses: ./.github/actions/flutter

      - name: Зависимости
        if: steps.probe.outputs.ready == 'true'
        run: flutter pub get --enforce-lockfile

      - name: Кодогенерация drift
        if: steps.probe.outputs.ready == 'true'
        run: dart run build_runner build

      - name: Собрать Windows
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        env:
          # Читает CMake раннера: от неё зависит заголовок окна.
          SNO_BRANCH: ${{ matrix.branch }}
          SUFFIX: ${{ matrix.suffix }}
          SNO_CLT_PASSWORD: ${{ secrets.SNO_CLT_PASSWORD }}
        run: |
          set -eu
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          # Пароль теста нагрузки — только сборке ветви и только из
          # секрета (SNO-F-CLT-01, SNO-DIV-06): в исходниках его нет.
          # Секрета нет (чужой форк, запрос на слияние со стороны) —
          # сборка ветви выходит без теста, и об этом сказано.
          clt=()
          if [ -n "${SNO_BRANCH:-}" ] && [ -n "${SNO_CLT_PASSWORD:-}" ]; then
            # Секрет могли вставить с пробелом или переводом строки.
            password=$(printf '%s' "$SNO_CLT_PASSWORD" | tr -d '\r\n ')
            # Пароль набирают цифрами на экране: пароль с буквой или
            # длиннее двенадцати знаков запер бы тест навсегда — и молча.
            if ! printf '%s' "$password" | grep -Eq '^[0-9]{1,12}$'; then
              echo "::error title=Тест нагрузки::секрет SNO_CLT_PASSWORD — не от одной до двенадцати цифр: такой пароль на экране не набрать"
              exit 1
            fi
            clt=(--dart-define=SNO_CLT_PASSWORD="$password")
          elif [ -n "${SNO_BRANCH:-}" ]; then
            echo "::warning title=Тест нагрузки::секрета SNO_CLT_PASSWORD нет — сборка ветви $SNO_BRANCH выходит без теста нагрузки"
          fi
          # SNO-F-CFG-06: сборка исследования — только по тегу sno2026-N
          # и только у ветви. Тег и день сборки зашиваются в приложение:
          # «О ветви» называет их, а запись кладёт в манифест. Сборка
          # исследования без пароля теста не выходит вовсе: на ней
          # записывают участников.
          study=()
          if [ -n "${SNO_BRANCH:-}" ] && [ "${GITHUB_EVENT_NAME:-}" = push ] \
            && [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            if ! printf '%s' "$GITHUB_REF_NAME" \
              | grep -Eq '^sno2026-[1-9][0-9]*([.][1-9][0-9]*)?$'; then
              echo "::error title=Сборка исследования::тег $GITHUB_REF_NAME — не sno2026-N и не sno2026-N.M"
              exit 1
            fi
            if [ -z "${SNO_CLT_PASSWORD:-}" ]; then
              echo "::error title=Сборка исследования::секрета SNO_CLT_PASSWORD нет — сборка исследования без теста нагрузки не выходит"
              exit 1
            fi
            study=(--dart-define=APP_STUDY_TAG="$GITHUB_REF_NAME")
          fi
          built=$(date -u +%F)
          flutter build windows --release \
            --dart-define=SNO_BRANCH="${SNO_BRANCH:-}" \
            --dart-define=APP_VERSION="$version-$SUFFIX" \
            --dart-define=APP_COMMIT="$GITHUB_SHA" \
            --dart-define=APP_BUILT="$built" \
            ${clt[@]+"${clt[@]}"} \
            ${study[@]+"${study[@]}"}

      # Заголовок окна — строка внутри memoria.exe, в UTF-16 и с нулевым
      # знаком в конце. У сборки ветви он свой, у основной — прежний, и
      # следа ветви в ней нет (SNO-F-CFG-01).
      - name: Что внутри memoria.exe
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        env:
          SNO_BRANCH: ${{ matrix.branch }}
          LABEL: ${{ matrix.label }}
          PYTHONUTF8: '1'
        run: |
          python - <<'PY'
          import os
          import sys

          path = 'build/windows/x64/runner/Release/memoria.exe'
          data = open(path, 'rb').read()
          # Пустая переменная до процесса может не дойти вовсе.
          branch = os.environ.get('SNO_BRANCH', '')
          label = os.environ['LABEL']


          def has(text):
              return text.encode('utf-16-le') in data


          problems = []
          if not has(label + '\0'):
              problems.append(f'заголовок окна не «{label}»')
          if not branch and has('\u0421\u041d\u041e2026'):
              problems.append('в основной сборке есть заголовок ветви')
          for problem in problems:
              print(f'::error title=Что внутри memoria.exe::{problem}')
          print(f'{path}: «{label}»')
          sys.exit(1 if problems else 0)
          PY

      # Спутник взгляда — только в ZIP ветвей (SNO-F-EYE-04): в основном
      # приложении и в MSIX айтрекера нет.
      - name: Спутник взгляда в сборку ветви
        if: steps.probe.outputs.ready == 'true' && matrix.branch != ''
        uses: actions/download-artifact@v8
        with:
          name: eye-windows
          path: build/windows/x64/runner/Release/eye

      - name: Спутник взгляда на месте
        if: steps.probe.outputs.ready == 'true'
        shell: pwsh
        env:
          SNO_BRANCH: ${{ matrix.branch }}
        run: |
          $eye = 'build/windows/x64/runner/Release/eye'
          if ($env:SNO_BRANCH) {
            foreach ($f in @('python.exe', 'sno_eye/__main__.py', 'sno_eye/record_check.py', 'sno_eye/study/__init__.py', 'models/face_landmarker.task', 'Проверка камеры.cmd', 'Проверка записи.cmd', 'Сравнение ветвей.cmd', 'Инструкция организатора.txt')) {
              if (-not (Test-Path (Join-Path $eye $f))) {
                Write-Output "::error title=Спутник взгляда::в сборке ветви нет eye/$f"
                exit 1
              }
            }
          } elseif (Test-Path $eye) {
            Write-Output '::error title=Спутник взгляда::в основном приложении есть папка eye/'
            exit 1
          }

      - name: Портативный ZIP
        if: steps.probe.outputs.ready == 'true'
        shell: pwsh
        env:
          ZIP: ${{ matrix.zip }}
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath $env:ZIP -Force

      - name: Упаковать MSIX
        if: steps.probe.outputs.ready == 'true' && matrix.msix
        run: dart run msix:create --store

      - name: Выложить сборки
        if: steps.probe.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.zip }}
            build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

      # SNO-ALG-EYE-03: связь приложения с настоящим спутником — тем же
      # кодом Dart, что в приложении, на настоящем Windows: запуск
      # python.exe без окна консоли, разбор настоящих ответов, общие часы
      # QPC у двух процессов, выход за две секунды. Последним шагом: ZIP
      # уже собран, и спутник ничего в него не допишет.
      - name: Связь с настоящим спутником
        if: steps.probe.outputs.ready == 'true' && matrix.branch == 'I'
        shell: pwsh
        run: |
          $env:SNO_EYE_DIR = (Resolve-Path 'build/windows/x64/runner/Release/eye').Path
          flutter test test/eye/eye_satellite_test.dart --reporter expanded 2>&1 | Tee-Object -FilePath eye-link.txt
          $code = $LASTEXITCODE
          Select-String -Path eye-link.txt -Pattern 'ЗАМЕР' | ForEach-Object {
            Write-Output "::notice title=Связь со спутником::$($_.Line)"
          }
          if ($code -ne 0) {
            Select-String -Path eye-link.txt -Pattern 'Expected|Actual|Error|Exception|Skip|\[E\]' |
              Select-Object -First 25 | ForEach-Object {
                Write-Output "::error title=Связь со спутником::$($_.Line)"
              }
            exit 1
          }

  report:
    name: Отчёт для сессии разработки
    needs: [analyze, android, windows, eye-tests, eye-windows]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Забрать вывод анализа
        uses: actions/download-artifact@v8
        with:
          name: ci-logs
          path: logs
        continue-on-error: true

      - name: Забрать вывод спутника взгляда
        uses: actions/download-artifact@v8
        with:
          pattern: eye-logs-*
          path: logs
          merge-multiple: true
        continue-on-error: true

      # Ветка `ci-report` — сиротская и переписывается каждым прогоном:
      # это не история, а последнее состояние. Сессия разработки читает
      # её обычным `git fetch`, потому что логи прогона закрыты для
      # неавторизованных, страницы GitHub без входа закэшированы на
      # недели, а `api.github.com` закрыт прокси контейнера.
      - name: Отчёт в ветку ci-report
        env:
          ANALYZE: ${{ needs.analyze.result }}
          ANDROID: ${{ needs.android.result }}
          WINDOWS: ${{ needs.windows.result }}
          EYE_TESTS: ${{ needs.eye-tests.result }}
          EYE_WINDOWS: ${{ needs.eye-windows.result }}
        run: |
          set -eu
          mkdir -p out
          {
            echo "# Прогон CI №$GITHUB_RUN_NUMBER"
            echo
            echo "- коммит: \`$GITHUB_SHA\`"
            echo "- ветка: \`$GITHUB_REF_NAME\`"
            echo "- анализ и тесты: **$ANALYZE**"
            echo "- сборка APK: **$ANDROID**"
            echo "- сборка Windows: **$WINDOWS**"
            echo "- спутник взгляда: тесты **$EYE_TESTS**, сборка **$EYE_WINDOWS**"
            echo "- страница прогона:"
            echo "  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > out/report.md
          for name in failures analyze format codegen measures tests sno sessions \
              eye-tests eye-windows eye-selftest; do
            file="logs/$name.txt"
            [ -s "$file" ] || continue
            {
              echo
              echo "## $name"
              echo '```'
              tail -c 60000 "$file"
              echo '```'
            } >> out/report.md
          done
          cd out
          git init -q
          git checkout -q -b ci-report
          git add report.md
          git -c user.name='Memoria CI' -c user.email='ci@memoria.local' \
            commit -q -m "отчёт прогона №$GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -q -f \
            "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" \
            ci-report

  # SNO-F-CFG-06 (шаг 33): сборка исследования СНО2026. Тег `sno2026-N`
  # (патч — `sno2026-N.M`) собирает те же сборки, что любой прогон, но
  # ветвям зашиваются тег и день сборки; здесь четыре сборки ветвей
  # ложатся отдельным предварительным релизом с постоянными именами
  # файлов. На этих сборках записывают участников, и они не меняются
  # всё время сбора данных; `latest` живёт дальше для проверок.
  # Репетиция — запуск по кнопке с `study_rehearsal`: файлы собираются
  # и сверяются, но релиз не публикуется.
  study:
    name: Сборка исследования СНО2026
    needs: [android, windows, eye-tests]
    if: >-
      (github.event_name == 'push'
        && startsWith(github.ref, 'refs/tags/sno2026-'))
      || (github.event_name == 'workflow_dispatch'
        && inputs.study_rehearsal)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Забрать сборки ветвей
        uses: actions/download-artifact@v8
        with:
          pattern: memoria-sno2026-*
          path: dist

      - name: Файлы релиза
        id: files
        run: |
          set -eu
          mkdir -p out
          take() {
            file=$(find dist -name "$1" | head -1)
            if [ -z "$file" ]; then
              echo "::error title=Сборка исследования::в артефактах прогона нет $1"
              exit 1
            fi
            cp "$file" "out/$1"
          }
          for branch in I II; do
            take "memoria-sno2026-$branch.apk"
            take "memoria-sno2026-$branch-windows.zip"
          done
          (cd out && sha256sum memoria-* > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt
          # Сборке исследования нужны «Проверка записи» и инструкция
          # организатора — они лежат в eye\ каждого ZIP. Имена читает
          # zipfile из Python: `unzip -Z1` в локали без UTF-8 экранирует
          # кириллицу, и сверка не нашла бы ничего.
          python3 - <<'PY'
          import sys
          import zipfile

          need = ['eye/Проверка записи.cmd', 'eye/Инструкция организатора.txt',
                  'eye/sno_eye/record_check.py', 'eye/Сравнение ветвей.cmd',
                  'eye/sno_eye/study/__init__.py']
          bad = False
          for branch in ('I', 'II'):
              path = f'out/memoria-sno2026-{branch}-windows.zip'
              names = {n.replace('\\', '/') for n in zipfile.ZipFile(path).namelist()}
              for name in need:
                  if name not in names:
                      print(f'::error title=Сборка исследования::в ZIP ветви {branch} нет {name}')
                      bad = True
          sys.exit(1 if bad else 0)
          PY
          number="${GITHUB_REF_NAME#sno2026-}"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Тег зашит в каждую сборку ветви: строка константы лежит в
      # снимке кода Dart — libapp.so у APK, data/app.so у Windows. Не
      # нашлась — замечание, а не отказ: как снимок хранит строки,
      # решает компилятор, а не мы.
      - name: Тег внутри сборок
        if: >-
          github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/sno2026-')
        run: |
          set -eu
          for branch in I II; do
            if unzip -p "out/memoria-sno2026-$branch.apk" \
                'lib/arm64-v8a/libapp.so' | grep -aqF "$GITHUB_REF_NAME"; then
              echo "APK ветви $branch: тег $GITHUB_REF_NAME на месте"
            else
              echo "::warning title=Сборка исследования::в APK ветви $branch строки $GITHUB_REF_NAME не нашлось — проверьте «О ветви» на устройстве"
            fi
            if unzip -p "out/memoria-sno2026-$branch-windows.zip" \
                'data/app.so' | grep -aqF "$GITHUB_REF_NAME"; then
              echo "ZIP ветви $branch: тег $GITHUB_REF_NAME на месте"
            else
              echo "::warning title=Сборка исследования::в ZIP ветви $branch строки $GITHUB_REF_NAME не нашлось — проверьте «О ветви» на ПК"
            fi
          done

      # Публикует только push тега: репетиция по кнопке — даже на теге —
      # релиза не трогает.
      - name: Опубликовать релиз исследования
        if: >-
          github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/sno2026-')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: СНО2026 · сборка ${{ steps.files.outputs.number }}
          prerelease: true
          make_latest: false
          files: out/*
          body: |
            Сборка исследования СНО2026 — та, на которой записывают
            участников. Она не меняется всё время сбора данных;
            исправления выходят патчами `sno2026-N.M` и только за то, что
            срывает сессию.

            - Телефон: `memoria-sno2026-I.apk`, `memoria-sno2026-II.apk`
            - ПК: `memoria-sno2026-I-windows.zip`,
              `memoria-sno2026-II-windows.zip` — в папке `eye\` лежат
              «Проверка записи.cmd» и «Инструкция организатора.txt»

            В приложении: «Тестирование» → «О ветви» — «Сборка
            исследования ${{ github.ref_name }}». Суммы файлов —
            `SHA256SUMS.txt`.

            Литературы в сборках нет — она приходит архивом. Сборки для
            проверок по-прежнему лежат в `latest`.

            Коммит: ${{ github.sha }}

      - name: Репетиция — без публикации
        if: github.event_name != 'push'
        run: |
          echo "::notice title=Сборка исследования::репетиция: файлы собраны и сверены, релиз не публикуется"
          ls -l out

  latest:
    name: Свежая сборка из main
    needs: [android, windows, eye-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Только сборки приложения: папка eye/ уже лежит в ZIP ветвей,
      # а отдельно — сотни мегабайт, которые здесь не нужны.
      - name: Забрать артефакты
        uses: actions/download-artifact@v8
        with:
          pattern: memoria*
          path: dist

      # Имена файлов постоянные — иначе ссылка «скачать последнее» будет
      # меняться от сборки к сборке, а весь смысл именно в том, чтобы она
      # не менялась никогда.
      #
      # Рядом с основным приложением лежат проверочные сборки ветвей
      # СНО2026 (SNO-F-CFG-01): владелец ставит их тем же скриптом, что
      # и основное. Литературы в них нет; пароль теста есть (шаг 24,
      # SNO-DIV-06). Сборки для участников сюда не попадают — они
      # выходят релизом исследования по тегу sno2026-N (работа `study`).
      - name: Постоянные имена файлов
        run: |
          set -eu
          mkdir -p out
          take() {
            file=$(find dist -name "$1" | head -1)
            if [ -z "$file" ]; then
              echo "::error::в артефактах прогона нет $1"
              exit 1
            fi
            cp "$file" "out/$2"
          }
          take memoria.apk memoria.apk
          take memoria-windows-portable.zip memoria-windows.zip
          for branch in I II; do
            take "memoria-sno2026-$branch.apk" "memoria-sno2026-$branch.apk"
            take "memoria-sno2026-$branch-windows.zip" \
              "memoria-sno2026-$branch-windows.zip"
          done
          ls -l out

      # Тег `latest` переезжает на свежий коммит main. Релиз помечен
      # предварительным, чтобы не подменять собой релизы этапов.
      - name: Обновить релиз latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Свежая сборка из main
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            Автоматическая сборка последнего коммита `main`. Обновляется
            сама после каждого зелёного прогона CI, ссылки не меняются:

            - Android: `releases/download/latest/memoria.apk`
            - Windows: `releases/download/latest/memoria-windows.zip`

            Файлы `memoria-sno2026-I…` и `memoria-sno2026-II…` —
            проверочные сборки ветвей для исследования СНО2026: то же
            приложение с другим набором разделов, ставится рядом с
            основным. Читателю они не нужны.

            Это черновик между этапами. Если нужна стабильная точка —
            берите релиз этапа со страницы релизов.

            Коммит: ${{ github.sha }}
