# Сборка релиза по тегу вида v0.1.0 или v0.1.0-alpha.1.
#
# Тег с дефисом (alpha, beta, rc) публикуется как предварительный релиз.
# Ключ подписи Android появляется в сессии S13; до тех пор сборки
# подписываются отладочным ключом и годятся только для тестирования.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK и AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Версия Flutter — одним значением в `.github/actions/flutter`
      # (S6.2.1): релиз обязан собираться тем же SDK, что и прогон CI.
      - uses: ./.github/actions/flutter

      - run: flutter pub get --enforce-lockfile

      - name: Кодогенерация drift
        run: dart run build_runner build

      # `--flavor full` — основное приложение (шаг 12): в проекте три
      # флейвора, и без названного флейвора сборка не знает, какой из
      # трёх APK отдать. Сборки ветвей СНО2026 релизом не выпускаются.
      - name: Собрать APK
        run: |
          flutter build apk --release --flavor full \
            --dart-define=APP_VERSION="$GITHUB_REF_NAME" \
            --dart-define=APP_COMMIT="$GITHUB_SHA"

      - run: flutter build appbundle --release --flavor full

      - name: Назвать файлы по версии
        run: |
          set -eu
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-full-release.apk \
            "out/memoria-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/fullRelease/app-full-release.aab \
            "out/memoria-${GITHUB_REF_NAME}.aab"

      - name: Выложить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*
          if-no-files-found: error

  windows:
    name: Портативный ZIP и MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Версия Flutter — одним значением в `.github/actions/flutter`
      # (S6.2.1): релиз обязан собираться тем же SDK, что и прогон CI.
      - uses: ./.github/actions/flutter

      - run: flutter pub get --enforce-lockfile

      - name: Кодогенерация drift
        run: dart run build_runner build

      - name: Собрать Windows
        shell: bash
        run: |
          flutter build windows --release \
            --dart-define=APP_VERSION="$GITHUB_REF_NAME" \
            --dart-define=APP_COMMIT="$GITHUB_SHA"

      # BUG-65: на ПК без пакета Visual C++ memoria.exe не запускается —
      # те же три библиотеки CRT, что в ci.yml, рядом с memoria.exe.
      - name: Библиотеки Visual C++ рядом с memoria.exe (BUG-65)
        shell: pwsh
        run: |
          $out = 'build/windows/x64/runner/Release'
          $dlls = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $redist = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Directory |
            Where-Object { $_.Name -match '^[0-9]+\.' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $crt = if ($redist) {
            Get-ChildItem (Join-Path $redist.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' |
              Select-Object -First 1
          }
          if (-not $crt) {
            Write-Output '::error title=BUG-65::нет библиотек Visual C++ у Visual Studio раннера'
            exit 1
          }
          foreach ($dll in $dlls) {
            Copy-Item (Join-Path $crt.FullName $dll) (Join-Path $out $dll) -Force
            if (-not (Test-Path (Join-Path $out $dll))) {
              Write-Output "::error title=BUG-65::рядом с memoria.exe нет $dll"
              exit 1
            }
          }

      - run: dart run msix:create --store

      - name: Назвать файлы по версии
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "out/memoria-$env:GITHUB_REF_NAME-windows.zip" -Force
          Get-ChildItem build/windows/x64/runner/Release/*.msix |
            ForEach-Object {
              Copy-Item $_.FullName "out/memoria-$env:GITHUB_REF_NAME.msix"
            }

      - name: Выложить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: out/*
          if-no-files-found: error

  publish:
    name: Опубликовать GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Забрать артефакты
        uses: actions/download-artifact@v8
        with:
          path: dist

      # В релиз идут только то, что человек может поставить руками: APK
      # и портативный ZIP. AAB нужен магазинам, а MSIX пока подписан
      # заглушечными данными Partner Center — обоим в релизе делать нечего,
      # они остаются артефактами прогона.
      - name: Создать релиз
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/release-android/*.apk
            dist/release-windows/*-windows.zip
          body: |
            ## Как поставить

            **Android.** Скачайте `.apk` прямо на телефон и откройте его.
            Android спросит разрешение на установку из этого источника —
            это нормально для приложений вне магазина.

            **Windows.** Скачайте ZIP, распакуйте, запустите `memoria.exe`.
            Установка не требуется.

            > ⚠️ Предварительная сборка. Приложение подписано **отладочным**
            > ключом: обновиться поверх неё будущим релизом не получится,
            > её нужно будет удалить и поставить заново.
