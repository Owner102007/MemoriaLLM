# Сборка релиза по тегу вида v0.1.0.
#
# Ключ подписи Android появляется в сессии S13; до тех пор сборки
# подписываются отладочным ключом и годятся только для тестирования.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK и AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - run: flutter build appbundle --release

      - name: Выложить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    name: Портативный ZIP и MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Портативный ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath memoria-windows-portable.zip -Force

      - run: dart run msix:create --store

      - name: Выложить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            memoria-windows-portable.zip
            build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

  publish:
    name: Опубликовать GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Забрать артефакты
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Создать релиз
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/release-android/**/*.apk
            dist/release-android/**/*.aab
            dist/release-windows/**/*.zip
            dist/release-windows/**/*.msix
