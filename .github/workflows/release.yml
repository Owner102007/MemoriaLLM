# Сборка релиза по тегу вида v0.1.0 или v0.1.0-alpha.1.
#
# Тег с дефисом (alpha, beta, rc) публикуется как предварительный релиз.
# Ключ подписи Android появляется в сессии S13; до тех пор сборки
# подписываются отладочным ключом и годятся только для тестирования.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK и AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Кодогенерация drift
        run: dart run build_runner build

      - run: flutter build apk --release

      - run: flutter build appbundle --release

      - name: Назвать файлы по версии
        run: |
          set -eu
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
            "out/memoria-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "out/memoria-${GITHUB_REF_NAME}.aab"

      - name: Выложить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*
          if-no-files-found: error

  windows:
    name: Портативный ZIP и MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Кодогенерация drift
        run: dart run build_runner build

      - run: flutter build windows --release

      - run: dart run msix:create --store

      - name: Назвать файлы по версии
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "out/memoria-$env:GITHUB_REF_NAME-windows.zip" -Force
          Get-ChildItem build/windows/x64/runner/Release/*.msix |
            ForEach-Object {
              Copy-Item $_.FullName "out/memoria-$env:GITHUB_REF_NAME.msix"
            }

      - name: Выложить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: out/*
          if-no-files-found: error

  publish:
    name: Опубликовать GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Забрать артефакты
        uses: actions/download-artifact@v8
        with:
          path: dist

      # В релиз идут только то, что человек может поставить руками: APK
      # и портативный ZIP. AAB нужен магазинам, а MSIX пока подписан
      # заглушечными данными Partner Center — обоим в релизе делать нечего,
      # они остаются артефактами прогона.
      - name: Создать релиз
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/release-android/*.apk
            dist/release-windows/*-windows.zip
          body: |
            ## Как поставить

            **Android.** Скачайте `.apk` прямо на телефон и откройте его.
            Android спросит разрешение на установку из этого источника —
            это нормально для приложений вне магазина.

            **Windows.** Скачайте ZIP, распакуйте, запустите `memoria.exe`.
            Установка не требуется.

            > ⚠️ Предварительная сборка. Приложение подписано **отладочным**
            > ключом: обновиться поверх неё будущим релизом не получится,
            > её нужно будет удалить и поставить заново. Чтения книг здесь
            > ещё нет — это каркас с темами.
