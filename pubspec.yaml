name: memoria
description: >-
  Memoria LLM HB — читалка PDF, возвращающая электронной книге свойства
  бумажной: страница во весь экран, неизменная вёрстка, объяснение слова
  и перевод по выделению.
publish_to: none
version: 0.6.2+22

# pdfrx 2.4 требует Dart 3.10 и Flutter 3.41: движок PDFium приезжает
# нативным ассетом через хуки сборки, а они появились именно там. Дальше
# границу поднимали пакеты приёма файла (fast_file_picker и saf_util
# собраны под AGP 9) — до Flutter 3.44.
#
# С S6.2.1 здесь написана настоящая граница, а не прежняя. Замок
# (`pubspec.lock`) держит pdfrx 2.6, а он требует Flutter 3.47 и
# Dart 3.13; обещать меньше, чем нужно, стало вредно — сборка на 3.44
# падала бы на `pub get` разговором про версии SDK вместо внятного
# «нужен Flutter 3.47». Версия, которой собирает CI, записана одним
# значением в `.github/actions/flutter`.
environment:
  flutter: '>=3.47.0'
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.6
  drift: ^2.20.0
  # Выбор файла, который сам файл не читает: прежний `file_selector` на
  # Android вычитывал книгу целиком в память и падал на 73 МБ.
  fast_file_picker: ^1.0.2
  # `pread` и `read` из libc: книга по ссылке `content://` читается прямо
  # по файловому дескриптору, без копии и без канала на каждое чтение.
  ffi: ^2.1.3
  # Только ради XTypeGroup: сам диалог открывает fast_file_picker.
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.4
  pdfrx: ^2.4.7
  # Storage Access Framework: сведения о документе и файловый дескриптор.
  saf_util: ^3.1.0
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  msix: ^3.16.0

flutter:
  uses-material-design: true
  # Светофильтры чтения. Шейдер компилируется при сборке; в `flutter test`
  # он не собирается, и слой фильтра сам переходит на цветовую матрицу.
  shaders:
    - shaders/reading_filter.frag

# Упаковка для Microsoft Store. Значения identity_name и publisher —
# заглушки до регистрации в Partner Center (сессия S13); подписывает MSIX
# сам Microsoft, поэтому сертификат в репозитории не нужен.
msix_config:
  display_name: Memoria LLM HB
  publisher_display_name: HohloBaron
  identity_name: Owner102007.MemoriaLLMHB
  publisher: CN=Owner102007
  msix_version: 0.6.2.1
  capabilities: internetClient
  store: true
